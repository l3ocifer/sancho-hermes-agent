---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sancho
  namespace: sancho
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`sancho.leopaska.xyz`)
      kind: Rule
      services:
        - name: sancho
          namespace: sancho
          port: 3001
      middlewares:
        - name: authelia
          namespace: security
  tls:
    certResolver: letsencrypt-prod

# ServiceMonitor removed (homelab#47): Hermes has no Prometheus exporter —
# the scrape target never came up and TargetDown fired forever. Re-add it
# together with an exporter if/when hermes grows a /metrics endpoint.
