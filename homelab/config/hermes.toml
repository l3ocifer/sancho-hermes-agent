# Hermes Agent — Sancho config
# Mounted at /home/hermes/.hermes/config.toml in the pod via ConfigMap.
# See https://hermes-agent.nousresearch.com/docs for full schema.

[agent]
name = "Sancho"
id = "sancho"
persona_file = "/home/hermes/.hermes/workspace/SOUL.md"
tools_file = "/home/hermes/.hermes/workspace/TOOLS.md"
agents_file = "/home/hermes/.hermes/workspace/AGENTS.md"
user_file = "/home/hermes/.hermes/workspace/USER.md"
killswitch_file = "/home/hermes/.hermes/workspace/KILLSWITCH.md"
handoff_file = "/home/hermes/.hermes/workspace/HANDOFF.md"

[models]
# Fleet default is `chat` (vllm-chat / Qwen3.5 27B AWQ on thebeast).
# `long` and `frontier` are opt-in per-task; do not auto-fallback to
# `long` because a wedged long backend can hang normal agent work.
default = "litellm/chat"
fallbacks = []

  [models.providers.litellm]
  type = "openai_compatible"
  base_url = "http://litellm.inference.svc.cluster.local:4000/v1"
  api_key_env = "LITELLM_API_KEY"
  # Claude Code Max aliases route through the household
  # claude-bridge service (homelab argocd/apps/_inference/55-claude-bridge.yaml).
  # Sancho is tier-7 of seven (6% weekly share). The scheduled morning
  # briefing starts on Sonnet, but ad-hoc calls may choose any Claude
  # Code model at call time via claude-code/<cli-model>.
  # On bridge 429, LiteLLM cascades sonnet→chat→frontier so cron always
  # delivers something to Leo's iMessage even when the household quota
  # is exhausted.
  models = ["chat", "long", "frontier", "claude-sonnet-max", "claude-opus-max", "claude-code/*", "embed", "rerank"]

[memory]
backend = "hybrid"

  [memory.sqlite]
  path = "/home/hermes/.hermes/memory.db"
  fts5 = true

  [memory.postgres]
  url_env = "DATABASE_URL"  # postgres://hermes_sancho@homelab-pg-rw.databases.svc.cluster.local:5432/hermes_sancho
  vector_extension = "pgvector"

  [memory.logseq]
  enabled = true
  graphs = [
    { name = "sancho", path = "/data/graphs/sancho", access = "rw" },
    { name = "leo", path = "/data/graphs/leo", access = "r+w-restricted", writable_paths = ["pages/world/calendar-context.md", "pages/world/people.md", "pages/world/open-loops.md", "pages/agent-contributions/sancho/"] },
    { name = "frick", path = "/data/graphs/frick", access = "r" },
    { name = "frack", path = "/data/graphs/frack", access = "r" },
  ]
  block_attribution = { agent = "sancho", auto = true }

  [memory.embeddings]
  provider = "litellm"
  model = "embed"  # routed by litellm to tei-embed
  dim = 1024

  [memory.search]
  hybrid = true
  vector_weight = 0.7
  text_weight = 0.3

[gateway]
enabled = true
bind = "0.0.0.0"
port = 3001

  [gateway.matrix]
  enabled = true
  homeserver = "https://conduit.leopaska.xyz"
  user_id = "@sancho:leopaska.xyz"
  access_token_env = "MATRIX_ACCESS_TOKEN"
  default_room = "!homelab:leopaska.xyz"

  [gateway.telegram]
  enabled = true
  bot_token_env = "TELEGRAM_BOT_TOKEN"
  prefix = "/sancho"  # routed via shared bot — only respond to messages prefixed /sancho

  [gateway.imessage]
  # Custom Hermes plugin pointing at the in-cluster BlueBubbles proxy
  enabled = true
  type = "bluebubbles-proxy"
  base_url = "http://bluebubbles-proxy.agents-shared.svc.cluster.local:8080"
  api_key_env = "BLUEBUBBLES_API_KEY"
  webhook_path = "/imessage/sancho"  # proxy forwards inbound iMessages here

  [gateway.ntfy]
  enabled = true
  outbound_only = true
  topic_url = "https://ntfy.leopaska.xyz/sancho"
  bearer_token_env = "NTFY_TOKEN"

  [gateway.homeassistant]
  enabled = true
  # HA lives in the `productivity` namespace, service name `home-assistant`
  # (was wrong: homeassistant.security — that service never existed).
  base_url = "http://home-assistant.productivity.svc.cluster.local:8123"
  token_env = "HOMEASSISTANT_TOKEN"
  conversation_entity = "conversation.sancho"

[mcp]
enabled = true

  [[mcp.servers]]
  name = "homelab-devops"
  url = "http://external-mcp.ironclaw.svc.cluster.local:8890"
  # Tool filter — Sancho gets read-only ops, no write tools.
  # NOTE: ha_* removed — those handlers in mcp-modules-rust are stubs that
  # fake success. Real HA control now comes from the `home-assistant`
  # server below (HA's first-party mcp_server / Assist API).
  allowed_tools = [
    "list_docker_containers", "list_k8s_pods",
    "list_databases", "service_health_check",
    "weather_*", "find_places", "query_overpass",
    "search_memory", "create_memory",
  ]

  # Real Home Assistant control/read via HA's first-party mcp_server
  # (Assist LLM API: turn devices on/off, query state, run scenes).
  # Fronted by the in-cluster nginx proxy that injects the HA token, so no
  # credentials are needed here (token-at-edge, like the other federated
  # servers). See homelab/argocd/apps/_mcp/50-home-assistant-mcp.yaml.
  [[mcp.servers]]
  name = "home-assistant"
  url = "http://home-assistant-mcp.mcp.svc.cluster.local:8080/mcp_server/sse"
  transport = "sse"
  allowed_tools = ["*"]

[skills]
load_from = ["/home/hermes/.hermes/skills"]
auto_create = true  # let Hermes self-improve, append to /skills

[security]
require_confirmation = [
  "send_email", "send_imessage", "send_sms",
  "calendar_create_external", "calendar_invite_send",
  "purchase_*", "subscription_*",
  "delete_*", "git_push",
  "ha_security_*", "ha_lock_*",
]
sandbox_python = true  # all python tool calls go in a subprocess sandbox
sandbox_shell = "docker"  # shell tool calls go in an ephemeral container

[quiet_hours]
enabled = true
window = "23:00-07:00"
timezone = "America/New_York"
suppress_outbound = ["imessage", "ntfy", "telegram"]
allow_outbound_on_p0 = true
allow_inbound_always = true

[hard_kill]
sentinel_path = "/data/HARDSTOP-SANCHO"
poll_interval_seconds = 30

# ─── Fleet event bus ─────────────────────────────────────────────────
# Durable async A2A backbone shared by all seven agents. Backed by
# Postgres LISTEN/NOTIFY on the `fleet` database (schema in
# scripts/agents/sql/fleet-schema.sql in the homelab repo, applied by
# argocd/apps/_postgres/fleet-schema-job.yaml).
# Connection string sealed in sancho-secrets as FLEET_DATABASE_URL.
[fleet]
enabled = true
agent_id = "sancho"
database_url_env = "FLEET_DATABASE_URL"
notify_channel = "fleet_events_new"
# Sancho is the personal-life agent — wakes for P0s, broadcasts, and
# explicit pings, plus any health/family/calendar event regardless of
# target.
inbound_predicate = "severity = 'p0' OR target IS NULL OR target = 'sancho' OR kind LIKE 'personal.%' OR kind LIKE 'health.%' OR kind LIKE 'family.%'"
on_trigger = "graceful_exit"

[heartbeat]
enabled = true
interval = "30m"
offset_minutes = 20  # :20 and :50 to avoid Frick (:00 :30) and Frack (:10 :40)
checks = ["calendar_conflicts", "deadline_approach", "followup_due"]
notify_on = ["P0", "P1"]

[cron]
# These [[cron.tasks]] entries are the SOURCE OF TRUTH for Sancho's
# scheduled work. They are reconciled into Hermes' jobs.json by the
# `sancho-cron-reconcile` Kubernetes Job (homelab/k8s/cron-reconcile-job.yaml)
# which calls Hermes' /api/jobs HTTP API on each ArgoCD sync.
#
# Per-task `model` field (optional):
#   - omit / null   → use the gateway default (long)
#   - "frontier"    → llamacpp-blade-frontier (slow, deepest reasoning)
#   - "long"        → vllm-long (262K window, mid quality)
#   - "chat"        → vllm-chat (fast, 20K window)
# Pin "frontier" only on tasks where reasoning quality matters more
# than latency AND the prompt+context fit in 64K tokens.

  [[cron.tasks]]
  name = "morning-briefing"
  schedule = "0 7 * * *"
  # Claude Sonnet via household Max. The morning briefing is the most
  # user-visible Sancho output (lands in Leo's iMessage at 07:00) so
  # it gets the paid model. Falls back via LiteLLM map (chat-thebeast →
  # frontier-blade) if sancho's 6% slice of the household weekly Claude
  # quota is exhausted. Everything else in this file keeps its existing
  # `frontier` / default routing — Sancho only spends Claude on the
  # most user-visible cron.
  model = "claude-sonnet-max"
  prompt = """
  Generate the daily morning briefing for Leo.
  Read pages/world/calendar-context.md (refreshed at 06:00).
  Read pages/world/open-loops.md.
  Pull weather for Leo's current location.
  Pull P1+ unread emails from himalaya draft folder.
  Format as a single iMessage (max 4 paragraphs).
  Send to Leo via BlueBubbles/iMessage.
  """
  delivery = ["bluebubbles"]

  [[cron.tasks]]
  name = "evening-recap"
  schedule = "0 18 * * *"
  model = "frontier"  # daily synthesis
  prompt = """
  Generate the evening recap.
  Today's completed calendar items, what got done, what's open.
  Tomorrow's first 3 calendar items as a heads-up.
  Format as a brief iMessage (max 3 paragraphs).
  """
  delivery = ["bluebubbles"]

  [[cron.tasks]]
  name = "memory-consolidate"
  schedule = "50 3 * * *"  # 03:50 — staggered behind Frick (03:00) and Frack (03:30)
  model = "frontier"  # deep nightly distillation; quality > latency
  prompt = "Run memory consolidation on yesterday's journal. Distill to pages/ai-memory/Sancho/decisions.md."
  delivery = []  # silent

  [[cron.tasks]]
  name = "calendar-refresh"
  schedule = "0 6 * * *"
  # default model — cheap CalDAV fetch, no reasoning required.
  prompt = "Pull next 24h of calendar from CalDAV. Write summary to pages/world/calendar-context.md."
  delivery = []

  [[cron.tasks]]
  name = "inbox-triage"
  schedule = "30 6 * * *"
  model = "frontier"  # drafts customer-facing replies; quality matters
  prompt = "Triage overnight inbox. Tag P0/P1/P2. Draft replies for high-priority items (drafts only, no send)."
  delivery = []

  [[cron.tasks]]
  name = "midday-check"
  schedule = "0 12 * * *"
  # default model — light status check.
  prompt = "Mid-day check: any unanswered iMessages from this morning? Calendar conflicts in the next 4h? Send a concise BlueBubbles/iMessage if anything is urgent; otherwise start with [SILENT]."
  delivery = ["bluebubbles"]

  [[cron.tasks]]
  name = "hourly-user-checkin"
  schedule = "42 10-22 * * *"
  # default model — frequent lightweight pings, low stakes.
  prompt = """
  Send Leo a concise hourly check-in.
  Review calendar context, open loops, recent inbound messages, and anything Sancho should keep Leo aware of.
  Keep it lightweight: at most 2 short paragraphs, with one direct question only if Leo input would unblock something.
  This check-in is intentionally user-facing; do not suppress it with [SILENT].
  """
  delivery = ["bluebubbles"]

[logging]
level = "info"
format = "json"
output = "stdout"  # captured by Vector → Loki

[telemetry]
prometheus_metrics = true
metrics_port = 9100
