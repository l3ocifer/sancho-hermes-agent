---
apiVersion: v1
kind: Service
metadata:
  name: sancho
  namespace: sancho
  labels:
    app.kubernetes.io/name: sancho
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sancho
  ports:
    - name: gateway
      port: 3001
      targetPort: gateway
      protocol: TCP
    - name: api
      port: 3002
      targetPort: api
      protocol: TCP
    - name: a2a
      port: 8443
      targetPort: api
      protocol: TCP
    - name: bbwh
      # BlueBubbles platform webhook (aiohttp app spun up by
      # gateway/platforms/bluebubbles.py — independent of the
      # main Hermes gateway on :3001).  The bluebubbles-proxy
      # POSTs forwarded inbound iMessages here with the BB
      # password as a query param.
      port: 8645
      targetPort: bbwh
      protocol: TCP
