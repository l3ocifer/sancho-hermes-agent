---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sancho
  namespace: agents-shared
  labels:
    app.kubernetes.io/name: sancho
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: agents
spec:
  replicas: 1
  strategy:
    type: Recreate                  # state PVC is RWO; cannot run two replicas
  selector:
    matchLabels:
      app.kubernetes.io/name: sancho
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sancho
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: sancho-ops
      restartPolicy: Always
      affinity:
        # Float across the cluster — no hard pinning. Soft-prefer
        # `alef` (matches Frick co-location for low-latency model
        # routing), but tolerate eviction to thebeast or any worker.
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 30
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - { key: app.kubernetes.io/name, operator: In, values: [frick] }
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [alef, thebeast, blade] }
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - { key: kubernetes.io/hostname, operator: In, values: [alef, thebeast] }
      securityContext:
        runAsNonRoot: false           # Hermes expects /home/hermes
        fsGroup: 0
      containers:
        - name: hermes
          image: git.leopaska.xyz/leo/sancho-hermes-agent:homelab
          imagePullPolicy: Always
          command: ["hermes"]
          args:
            - "gateway"
            - "run"
          env:
            - { name: AGENT_NAME, value: "Sancho" }
            - { name: AGENT_ID, value: "sancho" }
            - { name: HERMES_CONFIG, value: "/home/hermes/.hermes/config.yaml" }
            - { name: GATEWAY_HOST, value: "0.0.0.0" }
            - { name: GATEWAY_PORT, value: "3001" }
            - { name: GATEWAY_ALLOW_ALL_USERS, value: "true" }
            - { name: WEBHOOK_ENABLED, value: "true" }
            - { name: WEBHOOK_PORT, value: "3001" }
            # Hermes built-in API server. Enables /api/jobs HTTP CRUD
            # so cron-reconcile Jobs can declaratively manage cron
            # tasks via IaC (mirrors Vetinari's openfang /api/schedules
            # pattern). Cluster-only, ingress-gated by Authelia upstream.
            - { name: API_SERVER_ENABLED, value: "true" }
            - { name: API_SERVER_HOST,    value: "0.0.0.0" }
            - { name: API_SERVER_PORT,    value: "3002" }
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef: { name: sancho-secrets, key: A2A_BEARER_TOKEN }
            - { name: MATRIX_HOMESERVER, value: "https://conduit.leopaska.xyz" }
            - { name: MATRIX_USER_ID, value: "@sancho:leopaska.xyz" }
            - { name: MATRIX_HOME_ROOM, value: "!homelab:leopaska.xyz" }
            - { name: BLUEBUBBLES_PROXY_URL, value: "http://bluebubbles-proxy.agents-shared.svc.cluster.local:8080" }
            - { name: AGENT_TOOL_SERVICE_URL, value: "http://agent-tool-service.agents-shared.svc.cluster.local:8080" }
            - { name: SEARXNG_URL, value: "http://searxng.agents-shared.svc.cluster.local:8080" }
            # Hermes' BlueBubblesAdapter.connect() (gateway/platforms/bluebubbles.py)
            # only honours BLUEBUBBLES_SERVER_URL + BLUEBUBBLES_PASSWORD — the
            # proxy-mode envs above are read by gateway/config.py to register
            # the platform but never propagated to the adapter. Point the
            # adapter at the in-cluster Service for the real BB server on the
            # MacBook, with the real BlueBubbles password.
            - { name: BLUEBUBBLES_SERVER_URL, value: "http://bluebubbles-server.agents-shared.svc.cluster.local:1234" }
            - name: BLUEBUBBLES_PASSWORD
              valueFrom:
                secretKeyRef: { name: bluebubbles-proxy-secrets, key: BLUEBUBBLES_PASSWORD }
            - name: BLUEBUBBLES_HOME_CHANNEL
              valueFrom:
                secretKeyRef: { name: bluebubbles-proxy-secrets, key: LEO_IMESSAGE_HANDLE }
            # BlueBubbles platform webhook server (gateway/platforms/bluebubbles.py
            # spins up its own aiohttp app independent of the main gateway).
            # Defaults bind to 127.0.0.1:8645/bluebubbles-webhook which is
            # NOT reachable from other pods and uses the wrong path for the
            # bluebubbles-proxy fan-out. Override to listen on 0.0.0.0:8645
            # at /imessage/sancho — the URL the proxy POSTs to. The platform
            # still requires ?password=<BB_PASSWORD> on every inbound POST
            # (proxy's SANCHO_INBOUND_URL embeds it via $(BLUEBUBBLES_PASSWORD)
            # expansion in argocd/apps/_agents/bluebubbles-proxy in the
            # homelab repo).
            - { name: BLUEBUBBLES_WEBHOOK_HOST, value: "0.0.0.0" }
            - { name: BLUEBUBBLES_WEBHOOK_PORT, value: "8645" }
            - { name: BLUEBUBBLES_WEBHOOK_PATH, value: "/imessage/sancho" }
            - { name: TZ, value: "America/New_York" }
            - { name: HARDSTOP_PATH, value: "/data/HARDSTOP-SANCHO" }
          envFrom:
            - secretRef: { name: sancho-secrets }
          ports:
            - { name: gateway, containerPort: 3001, protocol: TCP }
            - { name: api,     containerPort: 3002, protocol: TCP }
            - { name: bbwh,    containerPort: 8645, protocol: TCP }
          livenessProbe:
            httpGet: { path: /health, port: gateway }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /health, port: gateway }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "300m", memory: "1Gi" }
            limits:   { memory: "4Gi" }
          volumeMounts:
            - { name: state,          mountPath: /home/hermes/.hermes }
            - { name: state,          mountPath: /data, subPath: hardstop }
            - { name: persona,        mountPath: /home/hermes/.hermes/workspace, readOnly: true }
            - { name: hermes-config,  mountPath: /home/hermes/.hermes/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: hermes-config,  mountPath: /home/hermes/.hermes/config.toml, subPath: config.toml, readOnly: true }
            - { name: graph-sancho,   mountPath: /data/graphs/sancho }
            - { name: graph-frick,    mountPath: /data/graphs/frick,    readOnly: true }
            - { name: graph-frack,    mountPath: /data/graphs/frack,    readOnly: true }
            - { name: graph-vetinari, mountPath: /data/graphs/vetinari, readOnly: true }
            - { name: graph-quirm,    mountPath: /data/graphs/quirm,    readOnly: true }
            - { name: graph-vimes,    mountPath: /data/graphs/vimes,    readOnly: true }
            - { name: graph-puck,     mountPath: /data/graphs/puck,     readOnly: true }
            - { name: graph-leo,      mountPath: /data/graphs/leo }
              # Restricted writes per HANDOFF.md §4 — runtime-enforced
              # by Hermes config.toml memory.logseq.graphs[].writable_paths
      volumes:
        - { name: state,          persistentVolumeClaim: { claimName: sancho-state } }
        - { name: persona,        configMap: { name: sancho-persona } }
        - { name: hermes-config,  configMap: { name: sancho-hermes-config } }
        - { name: graph-sancho,   persistentVolumeClaim: { claimName: sancho-graph } }
        - { name: graph-frick,    persistentVolumeClaim: { claimName: frick-graph } }
        - { name: graph-frack,    persistentVolumeClaim: { claimName: frack-graph } }
        - { name: graph-vetinari, persistentVolumeClaim: { claimName: vetinari-graph } }
        - { name: graph-quirm,    persistentVolumeClaim: { claimName: quirm-graph } }
        - { name: graph-vimes,    persistentVolumeClaim: { claimName: vimes-graph } }
        - { name: graph-puck,     persistentVolumeClaim: { claimName: puck-graph } }
        - { name: graph-leo,      persistentVolumeClaim: { claimName: leo-graph } }
      imagePullSecrets:
        - { name: forgejo-registry-credentials }
