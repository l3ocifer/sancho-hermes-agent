---
# Sancho cron-reconcile Job (idempotent, ArgoCD post-sync hook).
#
# Reads the [[cron.tasks]] entries from the mounted hermes.toml
# ConfigMap and reconciles them into Hermes' jobs.json via the
# built-in /api/jobs HTTP endpoint (enabled in deployment.yaml via
# API_SERVER_ENABLED=true on port 3002).
#
# Reconciliation rules (per-task, keyed by `name`):
#   - exists in toml + exists in API   → PATCH (model/schedule/prompt
#                                              /deliver may have changed)
#   - exists in toml, missing in API   → POST  (create)
#   - missing in toml, exists in API   → DELETE  ONLY IF the job's
#                                                origin == "iac" (set by
#                                                this Job on create).
#                                                Manually-created jobs
#                                                via the Hermes CLI are
#                                                preserved.
#
# Re-running this Job is safe: it converges to the toml's desired state
# every ArgoCD sync (Sync hook, hook-delete-policy on success).
apiVersion: batch/v1
kind: Job
metadata:
  name: sancho-cron-reconcile
  namespace: agents-shared
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sancho-cron-reconcile
    spec:
      restartPolicy: OnFailure
      containers:
        - name: reconcile
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              pip install --quiet --no-cache-dir 'httpx==0.28.*' 'tomli==2.*'
              exec python /scripts/reconcile.py
          env:
            - { name: AGENT_NAME,    value: "sancho" }
            - { name: AGENT_API,     value: "http://sancho.agents-shared.svc.cluster.local:3002" }
            - { name: HERMES_TOML,   value: "/config/config.toml" }
            - { name: ORIGIN_TAG,    value: "iac" }
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef: { name: sancho-secrets, key: A2A_BEARER_TOKEN }
          volumeMounts:
            - { name: hermes-config, mountPath: /config }
            - { name: scripts,       mountPath: /scripts }
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
      volumes:
        - { name: hermes-config, configMap: { name: sancho-hermes-config } }
        - { name: scripts,       configMap: { name: sancho-cron-reconcile-script } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sancho-cron-reconcile-script
  namespace: agents-shared
data:
  reconcile.py: |
    """Reconcile [[cron.tasks]] from hermes.toml into Hermes /api/jobs."""
    from __future__ import annotations

    import os
    import sys
    import time
    from typing import Any

    import httpx
    import tomli

    AGENT_NAME = os.environ["AGENT_NAME"]
    AGENT_API = os.environ["AGENT_API"].rstrip("/")
    TOML_PATH = os.environ["HERMES_TOML"]
    ORIGIN_TAG = os.environ.get("ORIGIN_TAG", "iac")
    API_HEADERS = {"Authorization": f"Bearer {os.environ['API_SERVER_KEY']}"}

    def _wait_for_api(client: httpx.Client) -> None:
        # Pod restart + API server bind-up takes a few seconds; budget 5min.
        for attempt in range(60):
            try:
                r = client.get(f"{AGENT_API}/api/jobs", headers=API_HEADERS, timeout=5)
                if r.status_code == 200:
                    return
            except Exception as exc:  # noqa: BLE001 — best-effort wait
                last = exc
            else:
                last = f"HTTP {r.status_code}"
            print(f"[{AGENT_NAME}] waiting for /api/jobs ({attempt + 1}/60): {last}", flush=True)
            time.sleep(5)
        raise SystemExit(f"[{AGENT_NAME}] /api/jobs unreachable after 5min")

    def _load_desired() -> list[dict[str, Any]]:
        with open(TOML_PATH, "rb") as fh:
            cfg = tomli.load(fh)
        tasks = cfg.get("cron", {}).get("tasks", [])
        out: list[dict[str, Any]] = []
        for raw in tasks:
            if not raw.get("name") or not raw.get("schedule"):
                print(f"[{AGENT_NAME}] skipping invalid task: {raw}", file=sys.stderr)
                continue
            out.append(
                {
                    "name": raw["name"],
                    "schedule": raw["schedule"],
                    "prompt": (raw.get("prompt") or "").strip(),
                    "deliver": ",".join(raw.get("delivery", []) or []) or "local",
                    "skills": raw.get("skills") or [],
                    # Per-task model pin (None → gateway default). Was silently
                    # dropped before 2026-07-17, so toml model pins never took
                    # effect and every cron ran on the default 24K chat model.
                    "model": raw.get("model"),
                    "origin": ORIGIN_TAG,
                }
            )
        return out

    def _index_existing(jobs: list[dict[str, Any]]) -> dict[str, dict[str, Any]]:
        return {j["name"]: j for j in jobs if j.get("name")}

    def _diff(desired: dict[str, Any], existing: dict[str, Any]) -> dict[str, Any]:
        # Compare only the fields we manage; ignore runtime-only state
        # (last_run_at, next_run_at, etc.).
        managed = ("schedule", "prompt", "deliver", "skills", "model")
        patch: dict[str, Any] = {}
        for key in managed:
            new_val = desired.get(key)
            cur_val = existing.get(key)
            # Hermes returns nested schedule as {"display": "...", ...};
            # compare against the cron string in schedule_display.
            if key == "schedule":
                cur_val = existing.get("schedule_display") or cur_val
            if new_val != cur_val:
                patch[key] = new_val
        return patch

    def _raise_for_status(response: httpx.Response, action: str) -> None:
        try:
            response.raise_for_status()
        except httpx.HTTPStatusError as exc:
            raise RuntimeError(
                f"{action} failed with HTTP {response.status_code}: {response.text[:500]}"
            ) from exc

    def main() -> None:
        with httpx.Client(timeout=15) as client:
            _wait_for_api(client)

            r = client.get(f"{AGENT_API}/api/jobs", headers=API_HEADERS)
            _raise_for_status(r, "list jobs")
            existing_list = r.json() if isinstance(r.json(), list) else r.json().get("jobs", [])
            existing = _index_existing(existing_list)

            desired = _load_desired()
            desired_names = {d["name"] for d in desired}

            created = updated = skipped = 0
            for spec in desired:
                name = spec["name"]
                if name in existing:
                    patch = _diff(spec, existing[name])
                    if not patch:
                        skipped += 1
                        continue
                    job_id = existing[name]["id"]
                    r = client.patch(f"{AGENT_API}/api/jobs/{job_id}", headers=API_HEADERS, json=patch)
                    _raise_for_status(r, f"update {name}")
                    updated += 1
                    print(f"[{AGENT_NAME}] updated {name}: {sorted(patch)}", flush=True)
                else:
                    r = client.post(f"{AGENT_API}/api/jobs", headers=API_HEADERS, json=spec)
                    _raise_for_status(r, f"create {name}")
                    created += 1
                    print(f"[{AGENT_NAME}] created {name}", flush=True)

            removed = 0
            for name, job in existing.items():
                if name in desired_names:
                    continue
                if (job.get("origin") or "") != ORIGIN_TAG:
                    # Manually-created job; don't touch.
                    continue
                r = client.delete(f"{AGENT_API}/api/jobs/{job['id']}", headers=API_HEADERS)
                if r.status_code in (200, 204, 404):
                    removed += 1
                    print(f"[{AGENT_NAME}] removed {name} (no longer in toml)", flush=True)

            print(
                f"[{AGENT_NAME}] reconcile done: "
                f"created={created} updated={updated} skipped={skipped} removed={removed}",
                flush=True,
            )

    if __name__ == "__main__":
        main()
